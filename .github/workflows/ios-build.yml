name: Build iOS (unsigned IPA)

# Run from the Actions tab, or automatically on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # "Lite" build: skips the Discord SDK.
      MORNYE_DISCORD_SDK: "0"
    defaults:
      run:
        working-directory: mornye-ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unzip source
        working-directory: .
        run: |
          test -f src.zip || { echo "src.zip is missing from the repo root" >&2; exit 1; }
          unzip -q src.zip
          ls mornye-ios

      - name: Select Xcode 26.1.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Activate pinned Rust toolchain
        working-directory: mornye-ios/rust_backend
        run: rustup show

      - name: Build Rust backend for iOS
        run: bash scripts/build_ios.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: mornye-ios/.fvmrc
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Normalize ffmpeg plugin shell scripts (strip CRLF)
        run: |
          find "$HOME/.pub-cache/hosted" -path "*ffmpeg_kit_flutter_new_audio*/scripts/*.sh" -type f -print0 |
            while IFS= read -r -d '' f; do
              perl -pi -e 's/\r$//' "$f"
              chmod +x "$f"
            done

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Install pods (Lite)
        working-directory: mornye-ios/ios
        run: pod install

      - name: Build archive (unsigned)
        run: |
          flutter build ios --release --no-codesign --config-only --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)"

          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Create IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd ios/build/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/out/Mornye-ios-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: out/Mornye-ios-unsigned.ipa
